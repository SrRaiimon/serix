<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#E8401C"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE7DC"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Mancuerna inclinada: barra y dos pares de discos, dentro de la zona segura del 80 % (icono adaptable). -->
  <g transform="rotate(-35 512 512)" fill="url(#metal)">
    <rect x="300" y="480" width="424" height="64" rx="32"/>
    <rect x="232" y="344" width="84" height="336" rx="30"/>
    <rect x="166" y="404" width="56" height="216" rx="26"/>
    <rect x="708" y="344" width="84" height="336" rx="30"/>
    <rect x="802" y="404" width="56" height="216" rx="26"/>
  </g>
</svg>
